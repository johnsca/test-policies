policies:
  - name: user-login-detected
    resource: account
    description: |
      Notifies Security and Cloud Admins teams on any AWS user console logins
    mode:
       type: cloudtrail
       events:
          - ConsoleLogin
    actions:
      - type: notify
        template: slack.j2
        to:
          - slack://event-owner
        transport:
          type: sqs
          queue: arn:aws:sqs:us-east-2:880584957794:dev-stacklet-commshub-messages
  - name: cory-sqs-missing-tag-bar
    resource: sqs
    filters:
      - "tag:Bar": absent
  - name: sqs-deny-insecure-traffic
    resource: aws.sqs
    description: |
      This policy identifies SQS queues that do not have a DenyInSecureTraffic statement in their policy.
    mode:
      type: pull
    filters:
      - not:
        - type: has-statement
          statements:
            - Effect: Deny
              Action: "sqs:*"
              Condition:
                Bool:
                  "aws:SecureTransport": "false"
  - name: sqs-test-policy
    resource: aws.sqs
    description: |
      This policy identifies SQS queues that do not have a test statement in their policy
    mode:
      type: pull
    filters:
      - not:
        - type: has-statement
          statements:
            - Effect: Allow
              Action: "sqs:*"
              Condition:
                Bool:
                  "aws:PrincipalOrgID": "o-does-not-exist"
  - name: cory-indexed-test-01
    <<: &trivial
      resource: aws.sqs
      description: |
        Trivial indexed test policy.
      mode:
        type: pull
      filters:
        - "tag:CoryIndexedTest": absent
  - name: cory-indexed-test-02
    <<: *trivial
